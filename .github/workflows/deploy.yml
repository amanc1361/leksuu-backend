# Deploy to the VPS on every push to main.
#
# The image is built ON THE SERVER (as before): the npm lockfile resolves through
# the liara mirror and Go modules may need an Iranian proxy, both of which work
# from the VPS but not from GitHub's runners. The server pulls exactly the pushed
# commit, then runs DEPLOY_COMMAND. Untracked files on the server (.env, data)
# are left alone.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST          server address                         (required)
#   VPS_USER          SSH user that can run docker           (required)
#   VPS_SSH_KEY       private key for that user              (required)
#   DEPLOY_PATH       path of this repo's clone on the VPS   (required)
#   VPS_PORT          SSH port                               (optional, default 22)
#   VPS_KNOWN_HOSTS   output of `ssh-keyscan -H <host>`      (optional, recommended)
#   DEPLOY_COMMAND    how to rebuild and restart             (optional, default: docker compose up -d --build)
#   HEALTHCHECK_URL   URL checked from the VPS after deploy  (optional, default: http://127.0.0.1:8080/healthz)
# Until the required secrets exist, runs are skipped with a warning.

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - name: Check deploy settings
        id: cfg
        run: |
          missing=""
          for v in VPS_HOST VPS_USER VPS_SSH_KEY DEPLOY_PATH; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Deploy skipped. Add these repository secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.cfg.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          port="${VPS_PORT:-22}"
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$port" -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
            echo "::warning::VPS_KNOWN_HOSTS is not set; trusting the host key seen now. Set it to pin the server's key."
          fi

      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          port="${VPS_PORT:-22}"
          deploy_command="${DEPLOY_COMMAND:-docker compose up -d --build}"
          healthcheck="${HEALTHCHECK_URL:-http://127.0.0.1:8080/healthz}"
          auth="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 -w0)"
          # The remote script receives its inputs on stdin, never as arguments,
          # so the short-lived fetch token doesn't appear in the server's
          # process list, and it is passed as a header so git never stores it.
          {
            printf 'DEPLOY_PATH=%q\n' "$DEPLOY_PATH"
            printf 'REPO=%q\n' "$GITHUB_REPOSITORY"
            printf 'SHA=%q\n' "$GITHUB_SHA"
            printf 'AUTH=%q\n' "$auth"
            printf 'DEPLOY_COMMAND=%q\n' "$deploy_command"
            printf 'HEALTHCHECK=%q\n' "$healthcheck"
            cat << 'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH" || { echo "DEPLOY_PATH does not exist on the server: $DEPLOY_PATH"; exit 1; }
          git rev-parse --is-inside-work-tree >/dev/null 2>&1 || { echo "$DEPLOY_PATH is not a git clone of $REPO"; exit 1; }
          echo "Deploying $REPO @ ${SHA:0:7} in $DEPLOY_PATH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --quiet "https://github.com/$REPO.git" "$SHA"
          git reset --hard --quiet FETCH_HEAD   # tracked files only; .env and data stay
          echo "Now at: $(git log --oneline -1)"
          echo "Running: $DEPLOY_COMMAND"
          bash -c "$DEPLOY_COMMAND"
          if [ -n "$HEALTHCHECK" ]; then
            echo "Health check: $HEALTHCHECK"
            ok=""
            for i in $(seq 1 30); do
              if command -v curl >/dev/null; then curl -fsS -o /dev/null "$HEALTHCHECK" && ok=1
              else wget -q -O /dev/null "$HEALTHCHECK" && ok=1; fi
              [ -n "$ok" ] && break
              sleep 5
            done
            [ -n "$ok" ] || { echo "Health check failed after 150s"; exit 1; }
            echo "Healthy."
          fi
          # Each deploy builds a new image; drop the dangling old ones so the
          # disk doesn't fill up over time.
          docker image prune -f >/dev/null 2>&1 || true
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -p "$port" \
                -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
                "$VPS_USER@$VPS_HOST" 'bash -s'
