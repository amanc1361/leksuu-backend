# Full backend stack: database + cache + migrations + API.
#   JWT_SECRET=$(openssl rand -hex 32) ADMIN_PASSWORD=... docker compose up --build
# The API runs with APP_ENV=production, so it refuses a placeholder JWT secret,
# never bootstraps an admin with the default password, and disables the
# simulated payment stub (set PAYMENT_PROVIDER=zarinpal + ZARINPAL_MERCHANT_ID
# to sell subscriptions). The database and cache listen on localhost only.
# A second copy (staging) sets COMPOSE_PROJECT_NAME and the *_PORT values in
# its own .env so its containers, volumes and ports never touch production.
name: ${COMPOSE_PROJECT_NAME:-leksuu-backend}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leksuu
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leksuu"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: applies migrations, then exits. The API waits for it to succeed.
  migrate:
    build:
      context: .
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
    # Existing content must never be reseeded as a side effect of deployment.
    # Run `docker compose run --rm migrate migrate seed` only for a fresh disposable DB.
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/leksuu?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/leksuu?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET to a long random secret}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000,https://leksuu.ir,https://www.leksuu.ir}"
      ADMIN_EMAILS: "${ADMIN_EMAILS:-admin@leksuu.app}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # Payments (ZarinPal). With PAYMENT_PROVIDER=zarinpal the API refuses to
      # start unless the three URLs are this site's public https addresses.
      # ZARINPAL_SANDBOX=true uses ZarinPal's test gateway (no money moves).
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-stub}"
      ZARINPAL_MERCHANT_ID: "${ZARINPAL_MERCHANT_ID:-}"
      ZARINPAL_SANDBOX: "${ZARINPAL_SANDBOX:-false}"
      BILLING_CALLBACK_URL: "${BILLING_CALLBACK_URL:-}"
      BILLING_SUCCESS_URL: "${BILLING_SUCCESS_URL:-}"
      BILLING_FAIL_URL: "${BILLING_FAIL_URL:-}"
      # media / object storage (local-disk default; persisted in the media volume).
      # For S3 object storage (ArvanCloud / MinIO), build the image with
      # `-tags pgx,s3` and set S3_ENDPOINT/S3_BUCKET/S3_ACCESS_KEY/S3_SECRET_KEY.
      # MEDIA_PUBLIC_URL is the base of the stored URLs: the site origin for a
      # private bucket, the bucket/CDN base when S3_PUBLIC_READ is true.
      MEDIA_PUBLIC_URL: "${MEDIA_PUBLIC_URL:-http://localhost:8080}"
      MEDIA_CDN_BASE_URL: "${MEDIA_CDN_BASE_URL:-}"
      MEDIA_DIR: /data/media
      # Set these in the deployment environment to store imported JSON and
      # course media directly in an S3-compatible bucket.
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      # Key prefix inside the bucket - storage layout only, never part of a URL.
      S3_PREFIX: "${S3_PREFIX:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_SECURE: "${S3_SECURE:-true}"
      # Default false: the bucket stays private and the API streams its bytes at
      # /media/<key>. Set true only for a bucket that allows anonymous reads.
      S3_PUBLIC_READ: "${S3_PUBLIC_READ:-false}"
      COVER_IMAGE_API_KEY: "${COVER_IMAGE_API_KEY:-}"
      COVER_IMAGE_MODEL: "${COVER_IMAGE_MODEL:-gpt-image-2.5-flare}"
      MEDIA_TRANSLATION_TARGETS: "${MEDIA_TRANSLATION_TARGETS:-fa,ckb}"
    ports: ["${API_PORT:-8080}:8080"]
    volumes: ["mediadata:/data/media"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The worker is part of the default stack so imports are processed without
  # an extra profile switch. Each replica claims one durable PostgreSQL job.
  media-worker:
    build:
      context: .
      dockerfile: Dockerfile.media-worker
      args:
        PYTHON_BASE: "${PYTHON_BASE:-python:3.11-slim-bookworm}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
    environment:
      MEDIA_JOBS_DATABASE_URL: postgres://postgres:postgres@db:5432/leksuu?sslmode=disable
      MEDIA_JOBS_MEDIA_BASE_URL: http://api:8080
      MEDIA_JOBS_PUBLIC_ORIGIN: "${MEDIA_PUBLIC_URL:-http://localhost:8080}"
      MEDIA_JOBS_MODEL_DIR: /models
      MEDIA_JOBS_MAX_BYTES: "${MEDIA_JOBS_MAX_BYTES:-2147483648}"
      MEDIA_FFMPEG_TIMEOUT: "${MEDIA_FFMPEG_TIMEOUT:-7200}"
      MEDIA_JOBS_LOCAL_MEDIA_DIR: /data/media
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_PREFIX: "${S3_PREFIX:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_SECURE: "${S3_SECURE:-true}"
      MEDIA_JOBS_TRANSLATION_MODEL_DIR: /models/madlad400-ct2
      MEDIA_TRANSLATION_TARGETS: "${MEDIA_TRANSLATION_TARGETS:-fa,ckb}"
    volumes: ["media-models:/models", "mediadata:/data/media"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  mediadata:
  media-models:
