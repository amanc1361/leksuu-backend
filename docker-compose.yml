# Full backend stack: database + cache + migrations + API.
#   docker compose up --build
name: leksuu-backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leksuu
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leksuu"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: applies migrations, then exits. The API waits for it to succeed.
  migrate:
    build:
      context: .
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
    command: ["migrate", "seed"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/leksuu?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/leksuu?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-prod
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      # media / object storage (local-disk default; persisted in the media volume).
      # For S3 object storage (ArvanCloud / MinIO), build the image with
      # `-tags pgx,s3`, set S3_ENDPOINT/S3_BUCKET/S3_ACCESS_KEY/S3_SECRET_KEY and
      # point MEDIA_PUBLIC_URL at the bucket/CDN base.
      MEDIA_PUBLIC_URL: http://localhost:8080
      MEDIA_DIR: /data/media
    ports: ["8080:8080"]
    volumes: ["mediadata:/data/media"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  mediadata:
