[project]
name = "leksuu-localization-agent"
version = "0.1.0"
description = "Independent educational localization MCP and hosted-agent control"
requires-python = ">=3.12"
dependencies = ["mcp>=1.26,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pydantic>=2.11,<3", "uvicorn>=0.35,<1", "tiktoken>=0.12,<1"]
[project.scripts]
l10n = "localizer.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
[tool.hatch.build.targets.wheel]
packages = ["src/localizer"]
