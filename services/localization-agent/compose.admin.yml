name: leksuu-localization-admin
services:
  workspace:
    image: leksuu-localization-admin:0.2.0
    build:
      context: .
      dockerfile: Dockerfile.admin
    restart: unless-stopped
    env_file: /opt/platform/secrets/localization-admin.env
    networks: [platform]
    volumes: [admin-state:/state]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 150s
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  platform:
    external: true
volumes:
  admin-state:
